name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # lib/prisma.ts requires a connection string when routes load during `next build`; the build
          # never connects. Real database settings live only in Vercel and team .env.local files.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
